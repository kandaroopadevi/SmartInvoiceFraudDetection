<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Trail · LedgerLens</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/app.css" rel="stylesheet"></head><body><nav class="navbar"><div class="container"><a class="navbar-brand" href="/">LedgerLens <span>ASSURANCE</span></a><a href="/">← Dashboard</a></div></nav><main class="container py-5"><div class="eyebrow">ASSURANCE / ACTIVITY</div><h1>Audit trail</h1><p class="muted mb-4">Recent uploads, review decisions and report exports.</p><section class="panel table-responsive"><table class="table"><thead><tr><th>ACTION</th><th>DETAILS</th><th>TIME</th></tr></thead><tbody><tr th:each="l : ${logs}"><td th:text="${l.action}"></td><td th:text="${l.details}"></td><td th:text="${l.createdAt}"></td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="3" class="empty">No activity has been recorded.</td></tr></tbody></table></section></main></body></html>
